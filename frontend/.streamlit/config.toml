# Streamlit defaults for Hello Agent — clean, simple support UI

[theme]
primaryColor = "#1F4E79"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#1A1A1A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
