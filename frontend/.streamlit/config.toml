# Streamlit theme — Grounded FAQ

[theme]
base = "light"
primaryColor = "#0E5C6B"
backgroundColor = "#E5F0F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F3A44"
font = "sans-serif"
headingFont = "sans-serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
