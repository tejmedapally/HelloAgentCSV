[project]
name = "hello-agent-backend"
version = "0.1.0"
description = "Hello Agent CSV FAQ backend (FastAPI + Claude dataframe agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "langchain>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
